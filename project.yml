name: Strata
options:
  bundleIdPrefix: cc.coolservices
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en
packages:
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui
    exactVersion: 2.4.1
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: CYYK3A72BM
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete
    STRING_CATALOG_GENERATE_SYMBOLS: NO
targets:
  Strata:
    type: application
    platform: iOS
    sources:
      - path: Strata
        excludes:
          - "**/*.md"
          - Resources/PyRuntime
          - Resources/PyRuntime/**
          - Resources/Skills
          - Resources/Skills/**
      - path: Strata/Resources/PyRuntime
        type: folder
        buildPhase: resources
      - path: Strata/Resources/Skills
        type: folder
        buildPhase: resources
    dependencies:
      - package: MarkdownUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cc.coolservices.strata
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Strata
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSCameraUsageDescription: Strata uses the camera to attach photos to your messages.
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Strata reads photos you choose to attach to your messages.
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: Strata saves figures you choose to your photo library.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Strata uses the microphone when you dictate a message.
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: Strata turns your dictation into text on this device.
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: Strata uses your approximate location when you ask the assistant to find places near you.
        INFOPLIST_KEY_UIUserInterfaceStyle: Automatic
        SWIFT_EMIT_LOC_STRINGS: YES
    info:
      path: Strata/Resources/Info.plist
      properties:
        BGTaskSchedulerPermittedIdentifiers:
          - cc.coolservices.strata.reply.*
        UIBackgroundModes:
          - processing
        UIAppFonts:
          - PretendardVariable.ttf
          - Pretendard-Regular.otf
          - Pretendard-Medium.otf
          - Pretendard-SemiBold.otf
          - Pretendard-Bold.otf
        UIFileSharingEnabled: true
        LSApplicationQueriesSchemes:
          - nmap
        LSSupportsOpeningDocumentsInPlace: true
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
  StrataMac:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: Strata
        excludes:
          - "**/*.md"
          - Resources/Info.plist
          - Resources/PyRuntime
          - Resources/PyRuntime/**
          - Resources/Skills
          - Resources/Skills/**
      - path: Strata/Resources/PyRuntime
        type: folder
        buildPhase: resources
      - path: Strata/Resources/Skills
        type: folder
        buildPhase: resources
    dependencies:
      - package: MarkdownUI
    entitlements:
      path: StrataMac/Strata.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.network.server: true # the 127.0.0.1 listener for the Sign in with ChatGPT redirect
        com.apple.security.files.user-selected.read-only: true
        com.apple.security.device.audio-input: true
        com.apple.security.personal-information.location: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cc.coolservices.strata.mac
        PRODUCT_NAME: Strata
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Strata
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Strata uses the microphone when you dictate a message.
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: Strata turns your dictation into text on this Mac.
        INFOPLIST_KEY_NSLocationUsageDescription: Strata uses your approximate location when you ask the assistant to find places near you.
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: Strata uses your approximate location when you ask the assistant to find places near you.
        SWIFT_EMIT_LOC_STRINGS: YES
    info:
      path: StrataMac/Info.plist
      properties:
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
  StrataTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: StrataTests
    dependencies:
      - target: Strata
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cc.coolservices.strata.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Strata.app/Strata
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  StrataMac:
    build:
      targets:
        StrataMac: all
  Strata:
    build:
      targets:
        Strata: all
    test:
      targets:
        - StrataTests
      gatherCoverageData: false
