name: Strata
options:
  bundleIdPrefix: cc.coolservices
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en
packages:
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui
    exactVersion: 2.4.1
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: CYYK3A72BM
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete
    STRING_CATALOG_GENERATE_SYMBOLS: NO
targets:
  Strata:
    type: application
    platform: iOS
    sources:
      - path: Strata
        excludes:
          - "**/*.md"
    dependencies:
      - package: MarkdownUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cc.coolservices.strata
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        INFOPLIST_KEY_CFBundleDisplayName: Strata
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSCameraUsageDescription: Strata uses the camera to attach photos to your messages.
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Strata reads photos you choose to attach to your messages.
        INFOPLIST_KEY_UIUserInterfaceStyle: Automatic
        SWIFT_EMIT_LOC_STRINGS: YES
    info:
      path: Strata/Resources/Info.plist
      properties:
        BGTaskSchedulerPermittedIdentifiers:
          - cc.coolservices.strata.reply.*
        UIBackgroundModes:
          - processing
        UIAppFonts:
          - PretendardVariable.ttf
          - Pretendard-Regular.otf
          - Pretendard-Medium.otf
          - Pretendard-SemiBold.otf
          - Pretendard-Bold.otf
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
  StrataTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: StrataTests
    dependencies:
      - target: Strata
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cc.coolservices.strata.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Strata.app/Strata
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  Strata:
    build:
      targets:
        Strata: all
    test:
      targets:
        - StrataTests
      gatherCoverageData: false
