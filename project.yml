name: Strata
options:
  bundleIdPrefix: cc.coolservices
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en
packages:
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui
    exactVersion: 2.4.1
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: CYYK3A72BM
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete
    STRING_CATALOG_GENERATE_SYMBOLS: NO
targets:
  Strata:
    type: application
    platform: iOS
    sources:
      - path: Strata
        excludes:
          - "**/*.md"
          - Resources/PyRuntime
          - Resources/PyRuntime/**
          - Resources/Skills
          - Resources/Skills/**
      - path: Strata/Resources/PyRuntime
        type: folder
        buildPhase: resources
      - path: Strata/Resources/Skills
        type: folder
        buildPhase: resources
    dependencies:
      - package: MarkdownUI
      - framework: Vendor/CLibSSH2.xcframework # libssh2 + OpenSSL libcrypto, static (Tools/build-libssh2.sh)
        embed: false
      - target: OpenChatWidgets # the Live Activity and the New Chat control, embedded in PlugIns
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cc.coolservices.strata
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: OpenChat
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSCameraUsageDescription: OpenChat uses the camera to attach photos to your messages.
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: OpenChat reads photos you choose to attach to your messages.
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: OpenChat saves figures you choose to your photo library.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: OpenChat uses the microphone when you dictate a message.
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: OpenChat turns your dictation into text on this device.
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: OpenChat uses your approximate location when you ask the assistant to find places near you.
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: OpenChat connects to servers on your local network when the assistant runs commands over SSH.
        INFOPLIST_KEY_UIUserInterfaceStyle: Automatic
        SWIFT_EMIT_LOC_STRINGS: YES
    info:
      path: Strata/Resources/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        NSSupportsLiveActivities: true
        BGTaskSchedulerPermittedIdentifiers:
          - cc.coolservices.strata.reply.*
        UIBackgroundModes:
          - processing
          - audio
        UIAppFonts:
          - PretendardVariable.ttf
          - Pretendard-Regular.otf
          - Pretendard-Medium.otf
          - Pretendard-SemiBold.otf
          - Pretendard-Bold.otf
        UIFileSharingEnabled: true
        LSApplicationQueriesSchemes:
          - nmap
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleURLTypes:
          - CFBundleURLName: OpenChat add-connection links
            CFBundleURLSchemes:
              - openchat
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
  # Widget extension: the Live Activity of running replies (`Strata/LiveActivity`) and the New Chat control. Named
  # for widgets in general, so Home Screen widgets and more controls can join it.
  OpenChatWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: Strata/LiveActivity/ReplyActivityAttributes.swift
      - path: Strata/LiveActivity/ReplyActivityViews.swift
      - path: Strata/Intents/NewChatControl.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cc.coolservices.strata.widgets
        PRODUCT_NAME: OpenChatWidgets
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: OpenChat
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) WIDGET_EXTENSION
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  StrataMac:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: Strata
        excludes:
          - "**/*.md"
          - Resources/Info.plist
          - Resources/PyRuntime
          - Resources/PyRuntime/**
          - Resources/Skills
          - Resources/Skills/**
      - path: Strata/Resources/PyRuntime
        type: folder
        buildPhase: resources
      - path: Strata/Resources/Skills
        type: folder
        buildPhase: resources
    dependencies:
      - package: MarkdownUI
      - framework: Vendor/CLibSSH2.xcframework # libssh2 + OpenSSL libcrypto, static (Tools/build-libssh2.sh)
        embed: false
    entitlements:
      path: StrataMac/Strata.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.network.server: true # the 127.0.0.1 listener for the Sign in with ChatGPT redirect
        com.apple.security.files.user-selected.read-only: true
        com.apple.security.device.audio-input: true
        com.apple.security.personal-information.location: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cc.coolservices.strata.mac
        # OpenChat.app, named OpenChat in the menu bar; the Swift module keeps its name.
        PRODUCT_NAME: OpenChat
        PRODUCT_MODULE_NAME: Strata
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: OpenChat
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSMicrophoneUsageDescription: OpenChat uses the microphone when you dictate a message.
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: OpenChat turns your dictation into text on this Mac.
        INFOPLIST_KEY_NSLocationUsageDescription: OpenChat uses your approximate location when you ask the assistant to find places near you.
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: OpenChat uses your approximate location when you ask the assistant to find places near you.
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: OpenChat connects to servers on your local network when the assistant runs commands over SSH.
        SWIFT_EMIT_LOC_STRINGS: YES
    info:
      path: StrataMac/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: OpenChat add-connection links
            CFBundleURLSchemes:
              - openchat
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
  StrataTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: StrataTests
    dependencies:
      - target: Strata
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cc.coolservices.strata.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Strata.app/Strata
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  StrataMac:
    build:
      targets:
        StrataMac: all
  Strata:
    build:
      targets:
        Strata: all
    test:
      targets:
        - StrataTests
      gatherCoverageData: false
