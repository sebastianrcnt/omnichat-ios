name: Strata
options:
  bundleIdPrefix: cc.coolservices
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en
packages:
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui
    exactVersion: 2.4.1
  OmniChatPackageKit: # the package format, MIT (docs/PACKAGES.md), shared with Tools/omnichat-pkg
    path: Packages/OmniChatPackageKit
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: CYYK3A72BM
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete
    STRING_CATALOG_GENERATE_SYMBOLS: NO
targets:
  Strata:
    type: application
    platform: iOS
    sources:
      - path: Strata
        excludes:
          - "**/*.md"
          - Resources/PyRuntime
          - Resources/PyRuntime/**
          - Resources/Skills
          - Resources/Skills/**
          - Resources/Packages
          - Resources/Packages/**
      - path: Strata/Resources/PyRuntime
        type: folder
        buildPhase: resources
      - path: Strata/Resources/Skills
        type: folder
        buildPhase: resources
      - path: Strata/Resources/Packages
        type: folder
        buildPhase: resources
    dependencies:
      - package: MarkdownUI
      - package: OmniChatPackageKit
      - framework: Vendor/CLibSSH2.xcframework # libssh2 + OpenSSL libcrypto, static (Tools/build-libssh2.sh)
        embed: false
      - target: OmniChatWidgets # the Live Activity and the New Chat control, embedded in PlugIns
      - target: StrataShare
    # Separate checked-in signing files keep Debug Health access out of Release. XcodeGen's entitlements block
    # would overwrite a configuration-specific CODE_SIGN_ENTITLEMENTS setting with its single generated path.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cc.coolservices.strata
        CODE_SIGN_ENTITLEMENTS: Strata/Strata.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: OmniChat
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSCameraUsageDescription: OmniChat uses the camera to attach photos to your messages.
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: OmniChat reads photos you choose to attach to your messages.
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: OmniChat saves figures you choose to your photo library.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: OmniChat uses the microphone when you dictate a message.
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: OmniChat turns your dictation into text on this device.
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: OmniChat uses your approximate location when you ask the assistant to find places near you.
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: OmniChat connects to devices on your local network when the assistant runs commands over SSH, or Python code connects to a device you allowed.
        INFOPLIST_KEY_UIUserInterfaceStyle: Automatic
        SWIFT_EMIT_LOC_STRINGS: YES
      configs:
        # STRATA_HEALTH is the v1 feature switch; only Debug links HealthKit.
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) STRATA_HEALTH
          CODE_SIGN_ENTITLEMENTS: Strata/Strata-Debug.entitlements
          INFOPLIST_KEY_NSHealthShareUsageDescription: OmniChat reads the health data you allow when you ask about your health.
          INFOPLIST_KEY_NSHealthUpdateUsageDescription: Debug builds write sample health data on a simulator for testing.
    info:
      path: Strata/Resources/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        NSSupportsLiveActivities: true
        BGTaskSchedulerPermittedIdentifiers:
          - cc.coolservices.strata.reply.*
        UIBackgroundModes:
          - processing
          - remote-notification # CloudKit pushes when another device changes a synced chat
        UIAppFonts:
          - PretendardVariable.ttf
          - Pretendard-Regular.otf
          - Pretendard-Medium.otf
          - Pretendard-SemiBold.otf
          - Pretendard-Bold.otf
        UIFileSharingEnabled: true
        LSApplicationQueriesSchemes:
          - nmap
          - comgooglemaps
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleURLTypes:
          - CFBundleURLName: OmniChat links
            CFBundleURLSchemes:
              - omnichat
              - openchat # links made before the rename to OmniChat (AppURLScheme)
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: cc.coolservices.omnichat.package
            UTTypeDescription: OmniChat package
            UTTypeConformsTo:
              - public.zip-archive
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - ocpkg
        # Package files typed by builds from before the rename to OmniChat (PackageFileType).
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: cc.coolservices.openchat.package
            UTTypeDescription: OmniChat package
            UTTypeConformsTo:
              - public.zip-archive
              - public.data
        CFBundleDocumentTypes:
          - CFBundleTypeName: OmniChat package
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes:
              - cc.coolservices.omnichat.package
              - cc.coolservices.openchat.package
        # Connections go to servers the user enters, and self-hosted ones (vLLM, Ollama, llama.cpp) are often plain http
        # under a domain name (a home server's DDNS, a tailnet name). NSAllowsLocalNetworking would override this key, so
        # it goes: local addresses are covered too. The connection editor warns when a non-local server uses http.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
  # Widget extension: the Live Activity of running replies (`Strata/LiveActivity`) and the New Chat control. Named
  # for widgets in general, so Home Screen widgets and more controls can join it.
  OmniChatWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: Strata/LiveActivity/ReplyActivityAttributes.swift
      - path: Strata/App/AppLinks.swift
      - path: Strata/LiveActivity/ReplyActivityViews.swift
      - path: Strata/Intents/NewChatControl.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cc.coolservices.strata.widgets
        PRODUCT_NAME: OmniChatWidgets
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: OmniChat
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) WIDGET_EXTENSION
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  StrataShare:
    # The share extension: "Share to OmniChat" from Safari, YouTube, Photos, Files and the rest (Strata/Share).
    type: app-extension
    platform: iOS
    sources:
      - path: StrataShare
      - path: Strata/Share/SharePayload.swift
      - path: Strata/App/AppLinks.swift
      - path: Strata/Share/ShareComposeView.swift
      - path: Strata/Share/ShareItemLoader.swift
      - path: Strata/DesignSystem/Tokens.swift
      - path: Strata/DesignSystem/Platform.swift
      - path: Strata/Models/ImageProcessor.swift
    entitlements:
      path: StrataShare/StrataShare.entitlements
      properties:
        com.apple.security.application-groups:
          - group.cc.coolservices.strata
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cc.coolservices.strata.share
        APPLICATION_EXTENSION_API_ONLY: YES
        PRODUCT_NAME: OmniChatShare
        INFOPLIST_KEY_CFBundleDisplayName: OmniChat
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        # Leaves out the parts of the shared design system files that need UIApplication.shared.
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) STRATA_EXTENSION
    info:
      path: StrataShare/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsImageWithMaxCount: 4
              NSExtensionActivationSupportsFileWithMaxCount: 3
  StrataMac:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: Strata
        excludes:
          - "**/*.md"
          - Resources/Info.plist
          - Resources/PyRuntime
          - Resources/PyRuntime/**
          - Resources/Skills
          - Resources/Skills/**
          - Resources/Packages
          - Resources/Packages/**
      - path: Strata/Resources/PyRuntime
        type: folder
        buildPhase: resources
      - path: Strata/Resources/Skills
        type: folder
        buildPhase: resources
      - path: Strata/Resources/Packages
        type: folder
        buildPhase: resources
    dependencies:
      - package: MarkdownUI
      - package: OmniChatPackageKit
      - framework: Vendor/CLibSSH2.xcframework # libssh2 + OpenSSL libcrypto, static (Tools/build-libssh2.sh)
        embed: false
    entitlements:
      path: StrataMac/Strata.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.network.server: true # the 127.0.0.1 listener for the Sign in with ChatGPT redirect
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.device.audio-input: true
        com.apple.security.personal-information.location: true
        # iCloud sync, shared with the iPhone app: the same CloudKit container, key-value store and Keychain access group.
        com.apple.developer.icloud-container-identifiers:
          - iCloud.cc.coolservices.strata
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)cc.coolservices.strata
        com.apple.developer.aps-environment: development
        keychain-access-groups:
          - $(AppIdentifierPrefix)cc.coolservices.strata
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cc.coolservices.strata.mac
        # OmniChat.app, named OmniChat in the menu bar; the Swift module keeps its name.
        PRODUCT_NAME: OmniChat
        PRODUCT_MODULE_NAME: Strata
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: OmniChat
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSMicrophoneUsageDescription: OmniChat uses the microphone when you dictate a message.
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: OmniChat turns your dictation into text on this Mac.
        INFOPLIST_KEY_NSLocationUsageDescription: OmniChat uses your approximate location when you ask the assistant to find places near you.
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: OmniChat uses your approximate location when you ask the assistant to find places near you.
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: OmniChat connects to devices on your local network when the assistant runs commands over SSH, or Python code connects to a device you allowed.
        SWIFT_EMIT_LOC_STRINGS: YES
    info:
      path: StrataMac/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: OmniChat links
            CFBundleURLSchemes:
              - omnichat
              - openchat # links made before the rename to OmniChat (AppURLScheme)
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: cc.coolservices.omnichat.package
            UTTypeDescription: OmniChat package
            UTTypeConformsTo:
              - public.zip-archive
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - ocpkg
        # Package files typed by builds from before the rename to OmniChat (PackageFileType).
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: cc.coolservices.openchat.package
            UTTypeDescription: OmniChat package
            UTTypeConformsTo:
              - public.zip-archive
              - public.data
        CFBundleDocumentTypes:
          - CFBundleTypeName: OmniChat package
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes:
              - cc.coolservices.omnichat.package
              - cc.coolservices.openchat.package
        # Connections go to servers the user enters, and self-hosted ones (vLLM, Ollama, llama.cpp) are often plain http
        # under a domain name (a home server's DDNS, a tailnet name). NSAllowsLocalNetworking would override this key, so
        # it goes: local addresses are covered too. The connection editor warns when a non-local server uses http.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
  StrataTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: StrataTests
    dependencies:
      - target: Strata
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cc.coolservices.strata.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Strata.app/Strata
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  StrataMac:
    build:
      targets:
        StrataMac: all
  Strata:
    build:
      targets:
        Strata: all
    test:
      targets:
        - StrataTests
      gatherCoverageData: false
