<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Composer Mockup</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
:root{
  --bg:#141414; --surface:#1d1d20; --raised:#2a2a2d; --line:#34343a;
  --text:#f2f2f4; --dim:#9b9ba3; --faint:#67676f;
  --accent:#8b5cf6; --accent2:#b9a2ff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0a0a0b;color:var(--text);font-family:"Pretendard Variable",Pretendard,-apple-system,system-ui,sans-serif;overflow-x:hidden}
body{display:flex;align-items:center;justify-content:center;gap:28px;flex-wrap:wrap;padding:24px}
.phone{position:relative;width:393px;height:852px;border-radius:56px;background:var(--bg);overflow:hidden;
  box-shadow:0 0 0 12px #1c1c1f,0 0 0 13px #3a3a40,0 30px 80px rgba(0,0,0,.6)}
.side{max-width:310px;color:var(--dim);font-size:14px;line-height:1.6}
.side h1{color:var(--text);font-size:20px;margin:0 0 8px}
@media (max-width:500px){
  body{padding:0;display:block;background:var(--bg)}
  .phone{width:100%;max-width:100vw;height:100dvh;border-radius:0;box-shadow:none}
  .side{display:none}
}
.status{position:absolute;top:0;left:0;right:0;height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 30px;font-weight:600;font-size:16px}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);height:36px;width:124px;border-radius:20px;background:#000}
.header{position:absolute;top:54px;left:0;right:0;height:64px;display:flex;align-items:center;gap:12px;padding:0 16px}
.circle{width:44px;height:44px;border-radius:50%;background:var(--raised);display:grid;place-items:center;font-size:18px;flex:none}
.title{flex:1;min-width:0}
.title b{display:block;font-size:16px}
.title span{font-size:12px;color:var(--dim)}

.tabs{position:absolute;top:124px;left:16px;right:16px;display:flex;gap:6px;background:var(--surface);border-radius:14px;padding:4px}
.tabs button{flex:1;border:0;background:none;color:var(--dim);font:inherit;font-size:13px;padding:8px 4px;border-radius:10px;cursor:pointer}
.tabs button.on{background:var(--raised);color:var(--text);font-weight:600}
.desc{position:absolute;top:176px;left:20px;right:20px;color:var(--dim);font-size:13.5px;line-height:1.6}
.desc b{color:var(--text)}
.hint{position:absolute;left:0;right:0;bottom:170px;text-align:center;color:var(--faint);font-size:12.5px;transition:opacity .2s}

/* composer */
.composer{position:absolute;left:12px;right:12px;bottom:28px;z-index:10;background:rgba(42,42,45,.9);backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,.07);border-radius:28px;padding:0 8px}
.composer .top{display:flex;align-items:center;gap:4px;height:56px;transition:height .3s}
.composer .input{flex:1;min-width:0;color:var(--faint);font-size:16.5px;padding:0 6px;cursor:text;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.composer .caret{display:inline-block;width:2px;height:20px;background:var(--accent);vertical-align:-4px;margin-right:1px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.ib{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--text);flex:none;cursor:pointer;background:none;border:0}
.ib:active{background:rgba(255,255,255,.08)}
.send{width:40px;height:40px;border-radius:50%;background:var(--accent);display:grid;place-items:center;flex:none;color:#fff;border:0;cursor:pointer}
.bottom{display:flex;align-items:center;gap:4px;height:0;overflow:hidden;opacity:0;transition:height .35s cubic-bezier(.3,1,.4,1),opacity .25s}
.composer.open .top{height:58px;align-items:flex-start;padding-top:16px}
.composer.open .bottom{height:54px;opacity:1}
.composer.open .top .plus,.composer.open .top .mic1{display:none}
.spacer{flex:1}
svg{display:block}

/* shared overlay */
.scrim{position:absolute;inset:0;z-index:20;display:none;background:rgba(0,0,0,0);transition:background .3s}
.scrim.on{display:block}
.scrim.dark{background:rgba(0,0,0,.45)}

/* popover */
.pop{position:absolute;z-index:21;right:20px;bottom:136px;width:290px;border-radius:24px;background:rgba(46,46,50,.94);backdrop-filter:blur(30px);
  box-shadow:0 18px 50px rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.08);padding:6px;transform-origin:85% 100%;
  transform:scale(.6);opacity:0;pointer-events:none;transition:transform .32s cubic-bezier(.2,1.2,.4,1),opacity .2s;overflow:hidden}
.pop.on{transform:none;opacity:1;pointer-events:auto}
.sec{font-size:12px;color:var(--faint);padding:8px 12px 4px}
.row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;font-size:15px;cursor:pointer}
.row:hover{background:rgba(255,255,255,.06)}
.row .val{margin-left:auto;color:var(--dim);font-size:14px}
.row .chev{color:var(--faint)}
.row .ck{margin-left:auto;color:var(--accent2)}
.row .nm{font-size:15px}
.row .id{font-size:11.5px;color:var(--faint)}
.row .hintline{font-size:11.5px;color:var(--faint)}
.div{height:1px;background:rgba(255,255,255,.07);margin:4px 8px}

/* slider */
.sl{padding:6px 14px 12px}
.sl .now{display:flex;align-items:baseline;gap:8px}
.sl .now b{font-size:17px}
.sl .now span{font-size:12px;color:var(--faint)}
.track{position:relative;height:34px;margin-top:8px;touch-action:none;cursor:pointer}
.track .rail{position:absolute;left:0;right:0;top:15px;height:4px;border-radius:2px;background:rgba(255,255,255,.12)}
.track .fill{position:absolute;left:0;top:15px;height:4px;border-radius:2px;background:var(--accent)}
.track .tick{position:absolute;top:13px;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:rgba(255,255,255,.25)}
.track .tick.on{background:var(--accent2)}
.track .knob{position:absolute;top:5px;width:24px;height:24px;margin-left:-12px;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.4);transition:left .12s}
.ends{display:flex;justify-content:space-between;font-size:11px;color:var(--faint);margin-top:2px}

/* pages inside popover (variant B) */
.pages{display:flex;width:200%;transition:transform .32s cubic-bezier(.3,1,.4,1)}
.pages > div{width:50%}
.pages.sub{transform:translateX(-50%)}
.back{display:flex;align-items:center;gap:6px;padding:10px 12px;color:var(--accent2);font-size:15px;cursor:pointer}

/* sheet (variant C) */
.sheet{position:absolute;z-index:21;left:0;right:0;bottom:0;background:#1f1f22;border-radius:30px 30px 0 0;padding:10px 16px 34px;
  transform:translateY(100%);transition:transform .38s cubic-bezier(.2,1,.3,1);max-height:78%;overflow-y:auto}
.sheet.on{transform:none}
.sheet .grab{width:38px;height:5px;border-radius:3px;background:rgba(255,255,255,.2);margin:0 auto 12px}
.sheet h3{margin:0 0 6px;text-align:center;font-size:16px}
.sheet .group{background:var(--surface);border-radius:16px;padding:4px;margin-top:8px}
</style>
</head>
<body>
<div class="side">
  <h1>입력창 목업 (생각 깊이 7단계)</h1>
  평소엔 한 줄 입력창이에요. 누르면 두 줄로 펼쳐지고, 아래 줄 게이지 버튼이 모델과 생각 깊이를 열어요.<br><br>
  게이지는 현재 깊이 비율만큼 채워져서 단계 수가 달라도 같은 모양이에요.<br><br>
  위 탭에서 세 가지 방식을 비교해 보세요: <b>슬라이더</b>, <b>하위 목록</b>, <b>시트</b>.
</div>

<div class="phone" id="phone">
  <div class="status"><span>20:40</span><span>95</span></div>
  <div class="island"></div>
  <div class="header"><div class="circle">≡</div><div class="title"><b>New chat</b><span id="sub">Strata Flash</span></div><div class="circle">◌</div></div>
  <div class="tabs" id="tabs"></div>
  <div class="desc" id="desc"></div>
  <div class="hint" id="hint">↓ 입력창을 눌러 보세요</div>

  <div class="scrim" id="scrim"></div>
  <div class="pop" id="pop"></div>
  <div class="sheet" id="sheet"></div>

  <div class="composer" id="composer">
    <div class="top">
      <button class="ib plus" aria-label="Attach" data-i="plus"></button>
      <div class="input" id="input">Message</div>
      <button class="ib mic1" aria-label="Dictate" data-i="mic"></button>
    </div>
    <div class="bottom">
      <button class="ib" aria-label="Attach" data-i="plus"></button>
      <div class="spacer"></div>
      <button class="ib" id="trigger" aria-label="Model and effort"></button>
      <button class="ib" aria-label="Dictate" data-i="mic"></button>
      <button class="send" aria-label="Send" data-i="up"></button>
    </div>
  </div>
</div>

<script>
const ICON = {
  plus:`<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>`,
  mic:`<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>`,
  up:`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6 11l6-6 6 6"/></svg>`,
};
document.querySelectorAll("[data-i]").forEach(b => b.innerHTML = ICON[b.dataset.i]);

const EFFORTS = [
  ["None","생각 안 함"],["Minimal","~512 토큰"],["Low","~2k 토큰"],["Medium","~8k 토큰"],
  ["High","~16k 토큰"],["Extra","~32k 토큰"],["Max","제한 없음"]];
const MODELS = [["Strata Flash","qwen3.8-flash-next"],["Strata Vision","qwen3.8-vl"],["GPT-4.1 mini","gpt-4.1-mini"]];
let effort = 3, model = 0, variant = 0;
const $ = id => document.getElementById(id);

function gauge(level, n){
  const frac = n > 1 ? level/(n-1) : 1, len = 31.4;
  const a = (-120 + 240*frac) * Math.PI/180, x = 12 + 6*Math.sin(a), y = 13 - 6*Math.cos(a);
  return `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke-linecap="round">
    <path d="M4.2 17.5a9 9 0 1 1 15.6 0" stroke="rgba(255,255,255,.22)" stroke-width="2.2"/>
    ${frac > 0 ? `<path d="M4.2 17.5a9 9 0 1 1 15.6 0" stroke="var(--accent2)" stroke-width="2.2" stroke-dasharray="${(len*frac).toFixed(1)} 99"/>` : ""}
    <line x1="12" y1="13" x2="${x.toFixed(2)}" y2="${y.toFixed(2)}" stroke="#fff" stroke-width="2"/><circle cx="12" cy="13" r="1.8" fill="#fff"/></svg>`;
}

const VARIANTS = [
  {name:"슬라이더", desc:"<b>메뉴 안 슬라이더.</b> 눈금을 밀어서 깊이를 고르고, 아래에서 모델을 골라요. 단계가 몇 개든 눈금 수만 바뀌어요.", open:openSlider},
  {name:"하위 목록", desc:"<b>메뉴 → 하위 목록.</b> 메뉴엔 \"생각 깊이 · Medium ›\" 한 줄만 있고, 누르면 같은 팝오버 안에서 목록으로 넘어가요.", open:openSub},
  {name:"시트", desc:"<b>아래에서 올라오는 시트.</b> 공간이 넉넉해서 단계마다 설명을 붙일 수 있어요. 대신 화면을 가려요.", open:openSheet},
];

function render(){
  $("tabs").innerHTML = VARIANTS.map((v,i) => `<button class="${i===variant?"on":""}" onclick="setVariant(${i})">${v.name}</button>`).join("");
  $("desc").innerHTML = VARIANTS[variant].desc;
  $("trigger").innerHTML = gauge(effort, EFFORTS.length);
  $("sub").textContent = MODELS[model][0];
}
function setVariant(i){ closeAll(); variant = i; render(); }

function openComposer(){
  const c = $("composer"); if (c.classList.contains("open")) return;
  c.classList.add("open");
  $("input").innerHTML = `<span class="caret"></span><span>Message</span>`;
  $("hint").textContent = "↓ 아래 줄의 게이지 버튼을 눌러 보세요";
}
$("input").onclick = openComposer;
$("trigger").onclick = () => { VARIANTS[variant].open(); $("hint").textContent = ""; };
$("scrim").onclick = closeAll;
function showScrim(dark){ $("scrim").classList.add("on"); requestAnimationFrame(() => $("scrim").classList.toggle("dark", !!dark)); }
function closeAll(){ $("pop").classList.remove("on"); $("sheet").classList.remove("on"); $("scrim").classList.remove("on","dark"); }

const modelRows = (close) => MODELS.map(([n,id],i) =>
  `<div class="row" onclick="setModel(${i},${close})"><div><div class="nm">${n}</div><div class="id">${id}</div></div>${i===model?'<span class="ck">✓</span>':""}</div>`).join("");
function setModel(i, close){ model = i; render(); if (close) closeAll(); else VARIANTS[variant].open(true); }
function setEffort(i, close){ effort = i; render(); if (close) closeAll(); else VARIANTS[variant].open(true); }

/* A: slider */
function sliderHTML(){
  const n = EFFORTS.length, pct = i => (i/(n-1))*100;
  return `<div class="sec">생각 깊이</div>
    <div class="sl"><div class="now"><b>${EFFORTS[effort][0]}</b><span>${EFFORTS[effort][1]}</span></div>
      <div class="track" id="track"><div class="rail"></div><div class="fill" style="width:${pct(effort)}%"></div>
        ${EFFORTS.map((_,i) => `<div class="tick ${i<=effort?"on":""}" style="left:${pct(i)}%"></div>`).join("")}
        <div class="knob" style="left:${pct(effort)}%"></div></div>
      <div class="ends"><span>빠르게</span><span>깊게</span></div></div>
    <div class="div"></div><div class="sec">모델</div>${modelRows(true)}
    <div class="div"></div><div class="row">⚙︎&nbsp;&nbsp;Manage connections<span class="val chev">›</span></div>`;
}
function openSlider(){
  $("pop").innerHTML = sliderHTML(); showScrim(false); $("pop").classList.add("on");
  const tr = $("track"); let drag = false;
  const at = e => { const r = tr.getBoundingClientRect(), x = (e.touches ? e.touches[0].clientX : e.clientX) - r.left;
    const i = Math.round(Math.max(0, Math.min(1, x / r.width)) * (EFFORTS.length - 1));
    if (i !== effort){ effort = i; render(); const keep = $("pop").scrollTop; $("pop").innerHTML = sliderHTML(); bind(); } };
  const bind = () => { const t = $("track");
    t.onmousedown = e => { drag = true; at(e); }; t.ontouchstart = e => { drag = true; at(e); };
  };
  window.onmousemove = e => drag && at(e); window.ontouchmove = e => drag && at(e);
  window.onmouseup = window.ontouchend = () => drag = false;
  bind();
}

/* B: submenu */
function openSub(stay){
  const inSub = stay && $("pop").querySelector(".pages.sub");
  $("pop").innerHTML = `<div class="pages ${inSub?"sub":""}" id="pages">
    <div><div class="row" onclick="$('pages').classList.add('sub')">생각 깊이<span class="val">${EFFORTS[effort][0]}</span><span class="chev">›</span></div>
      <div class="div"></div><div class="sec">모델</div>${modelRows(true)}
      <div class="div"></div><div class="row">⚙︎&nbsp;&nbsp;Manage connections<span class="val chev">›</span></div></div>
    <div><div class="back" onclick="$('pages').classList.remove('sub')">‹ 생각 깊이</div>
      ${EFFORTS.map(([n,h],i) => `<div class="row" onclick="setEffort(${i},false)"><div><div class="nm">${n}</div><div class="hintline">${h}</div></div>${i===effort?'<span class="ck">✓</span>':""}</div>`).join("")}</div></div>`;
  showScrim(false); $("pop").classList.add("on");
}

/* C: sheet */
function openSheet(){
  $("sheet").innerHTML = `<div class="grab"></div><h3>모델 · 생각 깊이</h3>
    <div class="sec">생각 깊이</div><div class="group">
      ${EFFORTS.map(([n,h],i) => `<div class="row" onclick="setEffort(${i},false)"><div><div class="nm">${n}</div><div class="hintline">${h}</div></div>${i===effort?'<span class="ck">✓</span>':""}</div>`).join("")}</div>
    <div class="sec" style="margin-top:10px">모델</div><div class="group">${modelRows(true)}</div>
    <div class="group"><div class="row">⚙︎&nbsp;&nbsp;Manage connections<span class="val chev">›</span></div></div>`;
  showScrim(true); $("sheet").classList.add("on");
}

render();
if (location.hash.match(/v(\d)/)) setVariant(+location.hash.match(/v(\d)/)[1]);
if (location.hash.includes("open")) openComposer();
if (location.hash.includes("menu")) $("trigger").onclick();
if (location.hash.includes("sub")) $("pages").classList.add("sub");
document.getElementById("phone").addEventListener("click", e => {
  const c = $("composer");
  if (c.classList.contains("open") && !c.contains(e.target) && !$("pop").contains(e.target) && !$("sheet").contains(e.target)
      && !$("tabs").contains(e.target) && !$("scrim").classList.contains("on") && e.target !== $("scrim")){
    c.classList.remove("open"); $("input").textContent = "Message"; $("hint").textContent = "↓ 입력창을 눌러 보세요";
  }
});
</script>
</body>
</html>
