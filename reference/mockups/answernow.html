<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Answer Now</title>
<style>
:root{--bg:#141414;--surface:#1d1d20;--raised:#2a2a2d;--line:#2f2f34;--text:#f2f2f4;--dim:#9b9ba3;--faint:#67676f;--accent:#8b5cf6;--accent2:#b9a2ff}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,system-ui,sans-serif;overflow-x:hidden}
.wrap{max-width:430px;margin:0 auto;padding:20px 18px 60px}
h1{font-size:20px;margin:6px 0 4px}
.sub{color:var(--dim);font-size:13.5px;line-height:1.6}
.opt{margin-top:24px;padding-top:16px;border-top:1px solid var(--line)}
.label{display:flex;align-items:baseline;gap:8px;margin-bottom:12px}
.label b{font-size:22px;color:var(--accent2)}
.label span{font-size:14px;color:var(--dim)}
.thought{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--dim);min-height:28px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--accent2);animation:p 1.2s infinite}
@keyframes p{50%{opacity:.3}}
.card{display:flex;align-items:center;gap:8px;background:var(--surface);border-radius:12px;padding:9px 12px;margin-top:8px;font-size:13.5px;color:var(--dim);min-width:0}
.card .q{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.badge{font-size:10.5px;font-weight:700;border-radius:5px;padding:1px 5px;background:#03c75a;color:#fff}
.badge.b{background:#0b84d8}
.n{font-size:12px;color:var(--faint)}
/* candidates */
.big{display:block;width:100%;margin-top:12px;height:46px;border-radius:23px;border:0;background:var(--raised);color:var(--text);font-size:16px;font-weight:600}
.pill{display:inline-flex;align-items:center;gap:5px;height:30px;padding:0 12px;border-radius:15px;border:1px solid var(--line);background:transparent;color:var(--dim);font-size:13px}
.right{display:flex;justify-content:flex-end;margin-top:10px}
.link{margin-left:auto;color:var(--accent2);font-size:13px;white-space:nowrap}
.icon{margin-left:auto;width:28px;height:28px;border-radius:14px;border:1px solid var(--line);display:grid;place-items:center;color:var(--dim);font-size:13px}
.composer{margin-top:18px;position:relative}
.float{position:absolute;top:-40px;left:50%;transform:translateX(-50%);height:30px;padding:0 14px;border-radius:15px;background:rgba(42,42,45,.92);border:1px solid var(--line);color:var(--text);font-size:13px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;box-shadow:0 4px 16px rgba(0,0,0,.4)}
.bar{display:flex;align-items:center;gap:8px;background:var(--surface);border-radius:24px;height:48px;padding:0 6px 0 16px;color:var(--faint);font-size:15px}
.bar .sp{flex:1}
.stop{width:36px;height:36px;border-radius:18px;background:var(--text);display:grid;place-items:center}
.stop i{width:11px;height:11px;border-radius:2px;background:var(--bg)}
.split{display:flex;align-items:center;gap:6px;background:var(--text);border-radius:18px;height:36px;padding:0 6px 0 12px;color:var(--bg);font-size:13px;font-weight:600}
.split i{width:24px;height:24px;border-radius:12px;background:rgba(0,0,0,.12);display:grid;place-items:center}
.split i b{width:9px;height:9px;border-radius:2px;background:var(--bg)}
.note{font-size:12.5px;color:var(--faint);margin-top:10px;line-height:1.5}
</style>
</head>
<body>
<div class="wrap">
  <h1>Answer now 버튼 후보</h1>
  <div class="sub">검색 중인 같은 화면에서 버튼만 바꿨어요. 맨 위가 지금 모습이에요.</div>
  <div id="list"></div>
</div>
<script>
const feed = (thoughtExtra = "") => `
  <div class="thought"><span class="dot"></span><span>출생아 수 통계 기사 찾는 중…</span>${thoughtExtra}</div>
  <div class="card"><span class="badge">N</span><span class="q">2026 출생아 수 1~8월</span><span class="n">5개</span></div>
  <div class="card"><span class="badge b">B</span><span class="q">통계청 인구동향 8월</span><span class="n">5개</span></div>`;
const composer = inner => `<div class="composer">${inner}</div>`;
const bar = (right = `<span class="stop"><i></i></span>`) => `<div class="bar">메시지<span class="sp"></span>${right}</div>`;
const OPTIONS = [
  ["현재", "가로 꽉 찬 큰 버튼", feed() + `<button class="big">Answer now</button>` + composer(bar())],
  ["A", "작은 캡슐, 오른쪽 정렬", feed() + `<div class="right"><span class="pill">↳ 지금 답하기</span></div>` + composer(bar())],
  ["B", "생각 줄 끝에 텍스트 링크", feed(`<span class="link">지금 답하기 ›</span>`) + composer(bar())],
  ["C", "생각 줄 끝에 아이콘만", feed(`<span class="icon">⏭</span>`) + composer(bar()), "누르면 바로 답해요. 아이콘만 있어서 처음엔 뜻이 덜 분명해요."],
  ["D", "입력창 위에 떠 있는 캡슐", feed() + `<div style="height:40px"></div>` + composer(`<span class="float">⏭ 지금 답하기</span>` + bar())],
  ["E", "정지 버튼과 합치기", feed() + composer(bar(`<span class="split">답하기<i><b></b></i></span>`)), "‘답하기’를 누르면 검색을 멈추고 답해요. 오른쪽 ■는 그냥 정지예요."],
];
document.getElementById("list").innerHTML = OPTIONS.map(([k, name, body, note]) => `
  <div class="opt">
    <div class="label"><b>${k}</b><span>${name}</span></div>
    ${body}
    ${note ? `<div class="note">${note}</div>` : ""}
  </div>`).join("");
</script>
</body>
</html>
